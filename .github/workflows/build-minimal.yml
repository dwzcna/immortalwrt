name: Build XR1710G minimal

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup build environment
        run: |
          sudo apt update
          sudo apt install -y build-essential clang gcc g++ binutils bzip2 gawk gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync unzip wget xsltproc zlib1g-dev file which perl sed make

      - name: Install feeds
        run: |
          # The private immortalwrt_packages feed is src-cpy-local only; the
          # minimal build does not use it, so drop that line on CI.
          sed '/^src-cpy /d' feeds.conf.default > feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          cat xr1710g.minimal.config > .config
          make defconfig

      - name: Download sources
        run: make download -j$(nproc) BUILD_LOG=1 2>&1 | tee download.log

      - name: Build firmware
        run: make -j$(nproc) world BUILD_LOG=1 2>&1 | tee build.log

      - name: Show build tail on failure
        if: failure()
        run: |
          grep -nE 'error:|Error [0-9]|FAILED|Patch failed' build.log | head -40 || true
          tail -100 build.log || true

      - name: Checksums
        if: success()
        run: |
          cd bin/targets/airoha/an7581
          sha256sum -- *-squashfs-sysupgrade.itb > sha256sums.sysupgrade

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xr1710g-minimal-firmware
          path: |
            download.log
            build.log
            bin/targets/airoha/an7581/*.itb
            bin/targets/airoha/an7581/*manifest
            bin/targets/airoha/an7581/config.buildinfo
            bin/targets/airoha/an7581/sha256sums*
          retention-days: 30
